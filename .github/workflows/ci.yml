name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: blockcraft
          POSTGRES_USER: blockcraft
          POSTGRES_PASSWORD: blockcraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blockcraft"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://blockcraft:blockcraft@localhost:5432/blockcraft
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov
      - name: API schemas are up to date (run make api-types)
        run: |
          uv run python manage.py spectacular --validate --fail-on-warn > ../frontend/openapi.yaml
          uv run python manage.py export_allauth_schema > ../frontend/allauth-openapi.json
          git diff --exit-code -- ../frontend/openapi.yaml ../frontend/allauth-openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: API types are up to date (run make api-types)
        run: |
          pnpm api-types
          git diff --exit-code -- src/lib/api/schema.d.ts src/lib/api/allauth.d.ts
