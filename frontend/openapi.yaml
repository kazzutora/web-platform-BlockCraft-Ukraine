    ProjectTypeEnum:
      enum:
      - mod
      - resourcepack
      - shader
      type: string
      description: |-
        * `mod` - Мод
        * `resourcepack` - Ресурспак
        * `shader` - Шейдер
    ProjectVersion:
      type: object
