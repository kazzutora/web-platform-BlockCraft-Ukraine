openapi: 3.0.3
info:
  title: BlockCraft API
  version: 1.0.0
  description: API of the BlockCraft Ukraine community platform.
paths:
  /api/v1/categories:
    get:
      operationId: categories_list
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - datapack
          - mod
          - resourcepack
          - shader
        description: Project type
      tags:
      - categories
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/collections:
    get:
      operationId: collections_list
      description: Public collections; with `owner` — the ones shown on their profile.
      parameters:
      - in: query
        name: owner
        schema:
          type: string
        description: Nickname of the owner
      tags:
      - collections
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionList'
          description: ''
    post:
      operationId: collections_create
      tags:
      - collections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/collections/{id}:
    get:
      operationId: collections_retrieve
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: share_token
        schema:
          type: string
        description: Token from the share link
      tags:
      - collections
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: collections_update
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - collections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCollectionWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCollectionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCollectionWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    delete:
      operationId: collections_delete
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - collections
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/collections/{id}/copy:
    post:
      operationId: collections_copy
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: share_token
        schema:
          type: string
      tags:
      - collections
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/collections/{id}/items:
    post:
      operationId: collections_items_add
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - collections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/collections/{id}/items/{item_id}:
    delete:
      operationId: collections_items_remove
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - collections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/collections/{id}/reorder:
    post:
      operationId: collections_reorder
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - collections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/compat/identify:
    post:
      operationId: compat_identify
      description: 'Only SHA-1 hashes: files never leave the player''s computer.'
      tags:
      - compat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentifyRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/compat/resolve:
    post:
      operationId: compat_resolve
      description: Up to 300 projects. `incomplete` — some dependencies are being
        imported from Modrinth, ask again in a few seconds.
      tags:
      - compat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResolveRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolveRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resolution'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/compat/updates:
    post:
      operationId: compat_updates
      description: '/import: what of these files can move to another game, and to
        which version.'
      tags:
      - compat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatesRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdatesRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdatesRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatesResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/csrf:
    get:
      operationId: csrf
      description: Sets the `csrftoken` cookie that the browser sends back in `X-CSRFToken`.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/favorites:
    post:
      operationId: favorites_add
      tags:
      - favorites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TargetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TargetRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    delete:
      operationId: favorites_remove
      parameters:
      - in: query
        name: id
        schema:
          type: string
          minLength: 1
          maxLength: 96
        required: true
      - in: query
        name: kind
        schema:
          enum:
          - collection
          - mod
          - skin
          - server
          - pack
          type: string
          minLength: 1
        description: |-
          * `collection` - collection
          * `mod` - mod
          * `skin` - skin
          * `server` - server
          * `pack` - pack
        required: true
      tags:
      - favorites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/health:
    get:
      operationId: health
      description: Checks that the database and Redis are reachable.
      summary: Service health
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/home:
    get:
      operationId: home
      description: 'Home page blocks (tech.md 10.4) for «Моя гра» of the viewer: mods
        and packs that fit it; without it — this week''s popular. Which objects to
        show is cached.'
      tags:
      - home
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
          description: ''
  /api/v1/jobs/{job_id}:
    get:
      operationId: jobs_retrieve
      description: State of a background job a page waits for; the random id is the
        access key.
      summary: Background job state
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        required: true
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: me_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    delete:
      operationId: me_delete
      description: 'Leaves the platform: the nickname must be typed again to confirm.'
      parameters:
      - in: query
        name: confirm
        schema:
          type: string
          minLength: 1
        description: The nickname, typed again.
        required: true
      - in: query
        name: mode
        schema:
          enum:
          - anonymize
          - delete
          type: string
          minLength: 1
        description: |-
          `anonymize`: keep the content under a placeholder name; `delete`: remove all.

          * `anonymize` - anonymize
          * `delete` - delete
        required: true
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/activity:
    get:
      operationId: me_activity
      description: «Взяв» (files, .mrpack, IP, PNG) or «Поділився» (packs, collections,
        reviews, translations, servers, added skins) with counts.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: section
        schema:
          enum:
          - took
          - shared
          type: string
          default: took
          minLength: 1
        description: |-
          * `took` - took
          * `shared` - shared
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/avatar:
    put:
      operationId: me_avatar_upload
      tags:
      - me
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    delete:
      operationId: me_avatar_delete
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/collections:
    get:
      operationId: me_collections
      parameters:
      - in: query
        name: id
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
        description: 'With `id`: mark collections holding it'
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyCollection'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/export:
    get:
      operationId: me_export
      description: Everything we keep about the player, as a downloadable JSON file.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/game:
    get:
      operationId: me_game_retrieve
      description: «Моя гра» of a signed-in player; guests keep it in the `bc_game`
        cookie.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    put:
      operationId: me_game_update
      description: «Моя гра» of a signed-in player; guests keep it in the `bc_game`
        cookie.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GameProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GameProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: me_game_partial_update
      description: «Моя гра» of a signed-in player; guests keep it in the `bc_game`
        cookie.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGameProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGameProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGameProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/notifications:
    get:
      operationId: me_notifications
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsPage'
          description: ''
