components:
  schemas:
    ActivityItem:
      type: object
      description: One row of «Взяв» or «Поділився».
      properties:
        type:
          $ref: '#/components/schemas/ActivityItemTypeEnum'
        kind:
          type: string
          nullable: true
        id:
          type: string
        title:
          type: string
        image:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        status:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        stars:
          type: integer
          nullable: true
        text:
          type: string
          nullable: true
        game_version:
          type: string
        loader:
          type: string
      required:
      - action
      - created_at
      - game_version
      - id
      - image
      - kind
      - loader
      - stars
      - status
      - text
      - title
      - type
    ActivityItemTypeEnum:
      enum:
      - took
      - pack
      - collection
      - review
      - translation
      - server
      - skin
      type: string
      description: |-
        * `took` - took
        * `pack` - pack
        * `collection` - collection
        * `review` - review
        * `translation` - translation
        * `server` - server
        * `skin` - skin
    ActivityPage:
      type: object
      properties:
        count:
          type: integer
        next_page:
          type: integer
          nullable: true
        counts:
          allOf:
          - $ref: '#/components/schemas/SharedCounts'
          nullable: true
          description: Only for «Поділився».
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
      required:
      - count
      - counts
      - next_page
      - results
    AddItemRequest:
      type: object
      description: '`{kind, id}`: id is a slug or a number depending on the kind.'
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        id:
          type: string
          minLength: 1
          maxLength: 96
        note:
          type: string
          maxLength: 140
      required:
      - id
      - kind
    AlgorithmEnum:
      enum:
      - sha1
      type: string
      description: '* `sha1` - sha1'
    ApiError:
      type: object
      description: Shape of every error response (see core.exceptions.handler).
      properties:
        detail:
          type: string
        code:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - detail
      - fields
    AvatarUploadRequest:
      type: object
      properties:
        avatar:
          type: string
          format: binary
