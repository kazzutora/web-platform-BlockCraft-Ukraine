openapi: 3.0.3
info:
  title: BlockCraft API
  version: 1.0.0
  description: API of the BlockCraft Ukraine community platform.
paths:
  /api/v1/categories:
    get:
      operationId: categories_list
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - mod
          - resourcepack
          - shader
        description: Project type
      tags:
      - categories
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/collections:
    get:
      operationId: collections_list
      description: Public collections; with `owner` — the ones shown on their profile.
      parameters:
      - in: query
        name: owner
        schema:
          type: string
        description: Nickname of the owner
      tags:
      - collections
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionList'
          description: ''
    post:
      operationId: collections_create
      tags:
      - collections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/collections/{id}:
    get:
      operationId: collections_retrieve
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: share_token
        schema:
          type: string
        description: Token from the share link
      tags:
      - collections
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: collections_update
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - collections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCollectionWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCollectionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCollectionWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    delete:
      operationId: collections_delete
      description: Shared lookups for collection endpoints; no HTTP methods of its
        own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - collections
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
