      type: object
      properties:
        banner:
          type: string
          format: binary
          description: PNG, JPEG or WebP up to 2 MB; cropped to 1200×300.
      required:
      - banner
    BasisEnum:
      enum:
      - profile
      - popular
      type: string
      description: |-
        * `profile` - profile
        * `popular` - popular
