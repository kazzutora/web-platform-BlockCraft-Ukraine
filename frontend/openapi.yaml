openapi: 3.0.3
info:
  title: BlockCraft API
  version: 1.0.0
  description: API of the BlockCraft Ukraine community platform.
paths:
  /api/v1/categories:
    get:
      operationId: categories_list
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - mod
          - resourcepack
          - shader
        description: Project type
      tags:
      - categories
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/csrf:
    get:
      operationId: csrf
      description: Sets the `csrftoken` cookie that the browser sends back in `X-CSRFToken`.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/health:
    get:
      operationId: health
      description: Checks that the database and Redis are reachable.
      summary: Service health
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: me_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/avatar:
    put:
      operationId: me_avatar_upload
      tags:
      - me
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    delete:
      operationId: me_avatar_delete
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/game-profile:
    get:
      operationId: me_game_profile_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: me_game_profile_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGameProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGameProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGameProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/onboarding:
    post:
      operationId: me_onboarding
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/settings:
    get:
      operationId: me_settings_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: me_settings_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserSettingsRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/mods:
    get:
      operationId: mods_list
      summary: Catalog of mods, packs and shaders
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category slugs, comma-separated; all must match.
      - in: query
        name: game_version
        schema:
          type: string
      - in: query
        name: gpu_load
        schema:
          type: string
          title: Навантаження на GPU
          enum:
          - heavy
          - light
          - medium
        description: |-
          * `light` - Легкий
          * `medium` - Середній
          * `heavy` - Важкий
      - in: query
        name: loader
        schema:
          type: string
        description: Applies to mods; resource packs and shaders pass.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - new
          - popular
          - top
          - trend
          - updated
        description: |-
          * `popular` - popular
          * `new` - new
          * `updated` - updated
          * `top` - top
          * `trend` - trend
      - in: query
        name: type
        schema:
          type: string
          enum:
          - mod
          - resourcepack
          - shader
        description: |-
          * `mod` - Мод
          * `resourcepack` - Ресурспак
          * `shader` - Шейдер
      tags:
      - mods
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectCardList'
          description: ''
  /api/v1/mods/{slug}:
    get:
      operationId: mods_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - mods
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/mods/{slug}/download:
    get:
      operationId: mods_download
      description: Redirects to the file on Modrinth and counts the download.
      parameters:
      - in: query
        name: game_version
        schema:
          type: string
          maxLength: 32
      - in: query
        name: loader
        schema:
          type: string
          maxLength: 32
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: version
        schema:
          type: string
          maxLength: 16
        description: Exact Modrinth version id.
      tags:
      - mods
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoVersionError'
          description: ''
  /api/v1/mods/{slug}/similar:
    get:
      operationId: mods_similar
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category slugs, comma-separated; all must match.
      - in: query
        name: game_version
        schema:
          type: string
      - in: query
        name: gpu_load
        schema:
          type: string
          title: Навантаження на GPU
          enum:
          - heavy
          - light
          - medium
        description: |-
          * `light` - Легкий
          * `medium` - Середній
          * `heavy` - Важкий
      - in: query
        name: loader
        schema:
          type: string
        description: Applies to mods; resource packs and shaders pass.
      - in: query
        name: q
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - new
          - popular
          - top
          - trend
          - updated
        description: |-
          * `popular` - popular
          * `new` - new
          * `updated` - updated
          * `top` - top
          * `trend` - trend
      - in: query
        name: type
        schema:
          type: string
          enum:
          - mod
          - resourcepack
          - shader
        description: |-
          * `mod` - Мод
          * `resourcepack` - Ресурспак
          * `shader` - Шейдер
      tags:
      - mods
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectCard'
          description: ''
  /api/v1/mods/{slug}/versions:
    get:
      operationId: mods_versions
      parameters:
      - in: query
        name: game_version
        schema:
          type: string
          maxLength: 32
      - in: query
        name: loader
        schema:
          type: string
          maxLength: 32
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - mods
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Versions'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/mods/suggest:
    post:
      operationId: mods_suggest
      description: Queue a Modrinth project for import; it waits for moderation.
      tags:
      - mods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuggestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuggestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/users/{nickname}:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: nickname
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
components:
  schemas:
    ApiError:
      type: object
      description: Shape of every error response (see core.exceptions.handler).
      properties:
        detail:
          type: string
        code:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - detail
      - fields
    AvatarUploadRequest:
      type: object
      properties:
        avatar:
          type: string
          format: binary
      required:
      - avatar
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        slug:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        project_type:
          $ref: '#/components/schemas/ProjectTypeEnum'
        header:
          type: string
          title: Група
          maxLength: 32
      required:
      - name
      - project_type
      - slug
    CheckStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    Dependency:
      type: object
      properties:
        project_id:
          type: string
        dependency_type:
          $ref: '#/components/schemas/DependencyTypeEnum'
        project:
          allOf:
          - $ref: '#/components/schemas/DependencyProject'
          nullable: true
      required:
      - dependency_type
      - project
      - project_id
    DependencyProject:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
          title: Назва
        icon_url:
          type: string
          format: uri
          readOnly: true
        project_type:
          allOf:
          - $ref: '#/components/schemas/ProjectTypeEnum'
          readOnly: true
      required:
      - icon_url
      - project_type
      - slug
      - title
    DependencyTypeEnum:
      enum:
      - required
      - optional
      - incompatible
      - embedded
      type: string
      description: |-
        * `required` - required
        * `optional` - optional
        * `incompatible` - incompatible
        * `embedded` - embedded
    EditionEnum:
      enum:
      - java
      - bedrock
      type: string
      description: |-
        * `java` - Java
        * `bedrock` - Bedrock
    GalleryImage:
      type: object
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
        featured:
          type: boolean
      required:
      - featured
      - title
      - url
    GameProfile:
      type: object
      properties:
        game_version:
          oneOf:
          - $ref: '#/components/schemas/GameVersionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        loader:
          oneOf:
          - $ref: '#/components/schemas/LoaderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        edition:
          $ref: '#/components/schemas/EditionEnum'
        interests:
          type: array
          items:
            $ref: '#/components/schemas/InterestsEnum'
          maxItems: 8
        onboarding_done:
          type: boolean
          readOnly: true
      required:
      - onboarding_done
    GameVersionEnum:
      enum:
      - '26.3'
      - '26.2'
      - 26.1.2
      - 26.1.1
      - '26.1'
      - 1.21.11
      - 1.21.10
      - 1.21.9
      - 1.21.8
      - 1.21.7
      - 1.21.6
      - 1.21.5
      - 1.21.4
      - 1.21.3
      - 1.21.2
      - 1.21.1
      - '1.21'
      - 1.20.6
      - 1.20.5
      - 1.20.4
      - 1.20.3
      - 1.20.2
      - 1.20.1
      - '1.20'
      - 1.19.4
      - 1.19.3
      - 1.19.2
      - 1.19.1
      - '1.19'
      - 1.18.2
      - 1.18.1
      - '1.18'
      - 1.17.1
      - '1.17'
      - 1.16.5
      - 1.16.4
      - 1.16.3
      - 1.16.2
      - 1.16.1
      - '1.16'
      - 1.12.2
      - 1.8.9
      type: string
      description: |-
        * `26.3` - 26.3
        * `26.2` - 26.2
        * `26.1.2` - 26.1.2
        * `26.1.1` - 26.1.1
        * `26.1` - 26.1
        * `1.21.11` - 1.21.11
        * `1.21.10` - 1.21.10
        * `1.21.9` - 1.21.9
        * `1.21.8` - 1.21.8
        * `1.21.7` - 1.21.7
        * `1.21.6` - 1.21.6
        * `1.21.5` - 1.21.5
        * `1.21.4` - 1.21.4
        * `1.21.3` - 1.21.3
        * `1.21.2` - 1.21.2
        * `1.21.1` - 1.21.1
        * `1.21` - 1.21
        * `1.20.6` - 1.20.6
        * `1.20.5` - 1.20.5
        * `1.20.4` - 1.20.4
        * `1.20.3` - 1.20.3
        * `1.20.2` - 1.20.2
        * `1.20.1` - 1.20.1
        * `1.20` - 1.20
        * `1.19.4` - 1.19.4
        * `1.19.3` - 1.19.3
        * `1.19.2` - 1.19.2
        * `1.19.1` - 1.19.1
        * `1.19` - 1.19
        * `1.18.2` - 1.18.2
        * `1.18.1` - 1.18.1
        * `1.18` - 1.18
        * `1.17.1` - 1.17.1
        * `1.17` - 1.17
        * `1.16.5` - 1.16.5
        * `1.16.4` - 1.16.4
        * `1.16.3` - 1.16.3
        * `1.16.2` - 1.16.2
        * `1.16.1` - 1.16.1
        * `1.16` - 1.16
        * `1.12.2` - 1.12.2
        * `1.8.9` - 1.8.9
    GpuLoadEnum:
      enum:
      - light
      - medium
      - heavy
      type: string
      description: |-
        * `light` - Легкий
        * `medium` - Середній
        * `heavy` - Важкий
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatusEnum'
        checks:
          $ref: '#/components/schemas/HealthChecks'
      required:
      - checks
      - status
    HealthChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/CheckStatusEnum'
        redis:
          $ref: '#/components/schemas/CheckStatusEnum'
      required:
      - database
      - redis
    InterestsEnum:
      enum:
      - survival
      - building
      - tech
      - pvp
      - rp
      - adventure
      - minigames
      - modded
      type: string
      description: |-
        * `survival` - Виживання
        * `building` - Будівництво
        * `tech` - Техніка й редстоун
        * `pvp` - PvP
        * `rp` - Рольова гра
        * `adventure` - Пригоди
        * `minigames` - Мініігри
        * `modded` - Моди й зборки
    LanguageEnum:
      enum:
      - uk
      - en
      type: string
      description: |-
        * `uk` - Українська
        * `en` - English
    LoaderEnum:
      enum:
      - fabric
      - forge
      - neoforge
      - quilt
      - vanilla
      type: string
      description: |-
        * `fabric` - Fabric
        * `forge` - Forge
        * `neoforge` - NeoForge
        * `quilt` - Quilt
        * `vanilla` - Vanilla
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nickname:
          type: string
          readOnly: true
          title: Нік
        avatar_url:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
          title: Про себе
        mc_nickname:
          type: string
          readOnly: true
          title: Нік у Minecraft
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Роль
        level:
          type: integer
          readOnly: true
        xp:
          type: integer
          readOnly: true
        is_private:
          type: boolean
          readOnly: true
          title: Закритий профіль
        published_count:
          type: integer
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата приєднання
        game_profile:
          allOf:
          - $ref: '#/components/schemas/GameProfile'
          readOnly: true
      required:
      - avatar_url
      - bio
      - date_joined
      - email
      - game_profile
      - id
      - is_private
      - level
      - mc_nickname
      - nickname
      - published_count
      - role
      - xp
