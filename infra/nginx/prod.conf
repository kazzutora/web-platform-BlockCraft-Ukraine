# Production: one origin over HTTPS for the frontend and the API.
# Rendered by the nginx image: ${DOMAIN} comes from the environment (docker-compose.prod.yml).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: only the Let's Encrypt challenge, everything else goes to HTTPS
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    return 301 https://${DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The largest upload is a 2 MB banner or avatar; Django checks each file again
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-prod.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:8000;
    set $frontend frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://$backend;
    }

    # A location with its own add_header drops the inherited ones: include them again
    location /api/docs/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api-docs.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://$backend;
    }

    location /_allauth/ {
        proxy_pass http://$backend;
    }

    # OAuth provider callbacks (Discord, Google)
    location /accounts/ {
        proxy_pass http://$backend;
    }

    location /admin/ {
        proxy_pass http://$backend;
    }

    # Collected by `collectstatic` in the backend image (Django admin)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # User uploads: images only, re-encoded on upload; never executed
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # Next.js build assets have content hashes in their names
    location /_next/static/ {
        proxy_pass http://$frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-prod.conf;
    }

    location / {
        proxy_pass http://$frontend;
    }
}
