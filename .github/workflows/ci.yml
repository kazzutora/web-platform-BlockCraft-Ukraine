name: CI

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml runs the same checks before a release
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: blockcraft
          POSTGRES_USER: blockcraft
          POSTGRES_PASSWORD: blockcraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blockcraft"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://blockcraft:blockcraft@localhost:5432/blockcraft
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov
      - name: API schemas are up to date (run make api-types)
        run: |
          uv run python manage.py spectacular --validate --fail-on-warn > ../frontend/openapi.yaml
          uv run python manage.py export_allauth_schema > ../frontend/allauth-openapi.json
          git diff --exit-code -- ../frontend/openapi.yaml ../frontend/allauth-openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: API types are up to date (run make api-types)
        run: |
          pnpm api-types
          git diff --exit-code -- src/lib/api/schema.d.ts src/lib/api/allauth.d.ts

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Environment of the stack (sign-up without email confirmation)
        run: |
          cp .env.example .env
          echo "ACCOUNT_EMAIL_VERIFICATION=none" >> .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API and the first page
        run: |
          for attempt in $(seq 1 60); do
            curl -fs http://localhost:8080/api/v1/health && curl -fs -o /dev/null http://localhost:8080/ && exit 0
            sleep 5
          done
          docker compose logs --tail 100
          exit 1
      - name: Demo content
        run: docker compose exec -T backend uv run python manage.py seed
      - name: Playwright
        run: |
          docker run --rm --network host --ipc=host -e CI=1 -v "$PWD/e2e:/e2e" -w /e2e \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            sh -c "corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm install --frozen-lockfile && npx playwright test"
      - name: Report and logs
        if: failure()
        run: docker compose logs --tail 200 backend frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
