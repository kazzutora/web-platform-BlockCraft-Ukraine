# Setup once: uv tool install pre-commit && pre-commit install
# Frontend hooks call pnpm on the host: Node.js 24 + `pnpm install` in frontend/.
exclude: ^frontend/(openapi\.yaml|src/lib/api/schema\.d\.ts|pnpm-lock\.yaml)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js|mjs|cjs)$
        pass_filenames: false
