  /api/v1/comments:
    get:
      operationId: comments_list
      description: Top-level comments with replies; the first page also brings the
        pinned one.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: string
          minLength: 1
          maxLength: 96
        required: true
      - in: query
        name: kind
        schema:
          enum:
          - collection
          - mod
          - skin
          - server
          type: string
          minLength: 1
        description: |-
          * `collection` - collection
          * `mod` - mod
          * `skin` - skin
          * `server` - server
        required: true
      tags:
      - comments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: comments_create
      description: GET for everyone, writes for signed-in users with a write-only
        throttle scope.
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
