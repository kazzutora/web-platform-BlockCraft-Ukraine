      type: object
      description: For closed profiles everything except the nickname is null.
      properties:
        nickname:
          type: string
        is_private:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        mc_nickname:
          type: string
          nullable: true
        level:
          type: integer
          nullable: true
