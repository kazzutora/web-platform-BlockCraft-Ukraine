# Development stack. Production: docker-compose.prod.yml (see docs/deploy.md).
name: blockcraft

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: .env
  volumes:
    - ./backend:/app
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meili:
    image: getmeili/meilisearch:v1.55
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data

  backend:
    <<: *backend
    command: >-
      sh -c "uv run python manage.py migrate --noinput
      && uv run python manage.py runserver 0.0.0.0:8000"

  worker:
    <<: *backend
    command: uv run celery -A config worker -l info

  beat:
    <<: *backend
    command: uv run celery -A config beat -l info -s /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: dev
    # Keeps the node_modules volume in sync with pnpm-lock.yaml after dependency changes
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm dev"
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    # On Windows drives file change events do not reach the container, and Turbopack
    # polling stalls on node_modules: develop the frontend on the host (make up-local).
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "8080:80"
    environment:
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-frontend:3000}
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - media:/var/www/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  meilidata:
  media:
  frontend_node_modules:
  frontend_next:
