        * `skin` - Скін
        * `server` - Сервер
    SuggestRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          description: Link to the project on Modrinth or its slug.
          maxLength: 300
      required:
      - url
    SuggestResponse:
      type: object
      properties:
        slug:
          type: string
        status:
          $ref: '#/components/schemas/SuggestResponseStatusEnum'
      required:
      - slug
      - status
    SuggestResponseStatusEnum:
      enum:
      - queued
      - exists
      type: string
      description: |-
        * `queued` - queued
        * `exists` - exists
    TargetQueryRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        id:
          type: string
          minLength: 1
          maxLength: 96
      required:
      - id
      - kind
    TargetRequest:
      type: object
      description: '`{kind, id}`: id is a slug or a number depending on the kind.'
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        id:
          type: string
          minLength: 1
          maxLength: 96
      required:
      - id
      - kind
    ThemeEnum:
      enum:
      - light
      - dark
      - system
      type: string
      description: |-
        * `light` - Світла
        * `dark` - Темна
        * `system` - Як у системі
    UserBrief:
      type: object
      description: Author shown next to reviews, comments and collections.
      properties:
        nickname:
          type: string
          readOnly: true
          title: Нік
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        level:
          type: integer
          readOnly: true
      required:
      - avatar_url
      - level
      - nickname
    UserSettings:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/ThemeEnum'
        language:
          $ref: '#/components/schemas/LanguageEnum'
        notify_prefs:
          type: object
          additionalProperties:
            type: boolean
        history_enabled:
          type: boolean
        who_can_comment:
          $ref: '#/components/schemas/WhoCanCommentEnum'
        collections_visible:
          type: boolean
    VersionTypeEnum:
      enum:
      - release
      - beta
      - alpha
      type: string
      description: |-
        * `release` - Реліз
        * `beta` - Бета
        * `alpha` - Альфа
    Versions:
      type: object
      description: What to install for the requested game version and loader.
      properties:
        game_version:
          type: string
        loader:
          type: string
        recommended:
          allOf:
          - $ref: '#/components/schemas/ProjectVersion'
          nullable: true
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
        nearest_game_versions:
          type: array
          items:
            type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ProjectVersion'
      required:
      - dependencies
      - game_version
      - loader
      - nearest_game_versions
      - recommended
      - versions
    VisibilityEnum:
      enum:
      - private
      - link
      - public
      type: string
      description: |-
        * `private` - Лише я
        * `link` - За посиланням
        * `public` - Усі
    WhoCanCommentEnum:
      enum:
      - all
      - followers
      - nobody
      type: string
      description: |-
        * `all` - Усі
        * `followers` - Лише підписники
        * `nobody` - Ніхто
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
