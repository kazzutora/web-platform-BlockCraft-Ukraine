# Rendered by the nginx image: ${FRONTEND_UPSTREAM} is replaced from the environment.
# One origin for the frontend and the API: session cookies + CSRF, no CORS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Resolve upstreams per request via Docker DNS, so Nginx starts even when
    # the frontend runs on the host (FRONTEND_UPSTREAM=host.docker.internal:3000).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:8000;
    set $frontend ${FRONTEND_UPSTREAM};

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://$backend;
    }

    location /_allauth/ {
        proxy_pass http://$backend;
    }

    location /admin/ {
        proxy_pass http://$backend;
    }

    # Django admin and Swagger UI assets (runserver serves them in dev)
    location /static/ {
        proxy_pass http://$backend;
    }

    location /media/ {
        alias /var/www/media/;
    }

    location / {
        proxy_pass http://$frontend;
        # Next.js hot reload uses a WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
