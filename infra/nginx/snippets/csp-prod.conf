# Next.js App Router inlines its bootstrap scripts, hence 'unsafe-inline' (nonces: later).
# Any HTTPS image: mod descriptions from Modrinth embed pictures from GitHub, imgur and others.
# OAuth sign-in posts a form that redirects to Discord or Google.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://discord.com https://accounts.google.com; upgrade-insecure-requests" always;
