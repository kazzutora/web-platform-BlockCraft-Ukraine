components:
  schemas:
    AddItemRequest:
      type: object
      description: '`{kind, id}`: id is a slug or a number depending on the kind.'
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        id:
          type: string
          minLength: 1
          maxLength: 96
        note:
          type: string
          maxLength: 140
        slot:
          oneOf:
          - $ref: '#/components/schemas/SlotEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - id
      - kind
    ApiError:
      type: object
      description: Shape of every error response (see core.exceptions.handler).
      properties:
        detail:
          type: string
        code:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - detail
      - fields
    AvatarUploadRequest:
      type: object
      properties:
        avatar:
          type: string
          format: binary
      required:
      - avatar
