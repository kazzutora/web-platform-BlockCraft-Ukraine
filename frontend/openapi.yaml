          allOf:
          - $ref: '#/components/schemas/VersionTypeEnum'
          readOnly: true
        game_versions:
          type: array
          items:
            type: string
            maxLength: 32
          readOnly: true
        loaders:
          type: array
          items:
            type: string
            maxLength: 32
          readOnly: true
        file_name:
