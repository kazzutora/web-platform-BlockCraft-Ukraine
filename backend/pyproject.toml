[project]
name = "blockcraft-backend"
version = "0.1.0"
description = "BlockCraft Ukraine API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]>=5.5",
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "django-redis>=6.0",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "redis>=6.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-django>=4.11",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "C4", "RUF"]
# DRF declares permission_classes etc. as mutable class attributes by design
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
addopts = "--ds=config.settings.test --strict-markers -q"
python_files = ["test_*.py"]
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
