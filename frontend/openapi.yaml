components:
  schemas:
    AddItemRequest:
      type: object
      description: '`{kind, id}`: id is a slug or a number depending on the kind.'
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        id:
          type: string
          minLength: 1
          maxLength: 96
        note:
          type: string
          maxLength: 140
        slot:
          oneOf:
          - $ref: '#/components/schemas/SlotEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - id
      - kind
    ApiError:
      type: object
      description: Shape of every error response (see core.exceptions.handler).
      properties:
        detail:
          type: string
        code:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - detail
      - fields
    AvatarUploadRequest:
      type: object
      properties:
        avatar:
          type: string
          format: binary
      required:
      - avatar
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        slug:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        project_type:
          $ref: '#/components/schemas/ProjectTypeEnum'
        header:
          type: string
          title: Група
          maxLength: 32
      required:
      - name
      - project_type
      - slug
    CheckStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    Collection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          title: Назва
        description:
          type: string
          readOnly: true
          title: Опис
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        items_count:
          type: integer
          readOnly: true
        likes_count:
          type: integer
          readOnly: true
        favorites_count:
          type: integer
          readOnly: true
        is_setup:
          type: boolean
          readOnly: true
        preview:
          type: array
          items:
