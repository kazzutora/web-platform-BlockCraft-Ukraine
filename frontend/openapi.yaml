            format: uri
          readOnly: true
        can_edit:
          type: boolean
          readOnly: true
        is_liked:
          type: boolean
          readOnly: true
        is_favorited:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
